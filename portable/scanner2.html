<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner - GARANTILI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .status.success { border-left-color: #27ae60; background: #d4edda; }
        .status.error { border-left-color: #e74c3c; background: #f8d7da; }
        .status.warning { border-left-color: #f39c12; background: #fff3cd; }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
            min-height: 300px;
            background: #f0f0f0;
        }
        .result-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 2px solid #ddd;
        }
        .result-box.success { border-color: #27ae60; background: #d4edda; }
        .result-box.error { border-color: #e74c3c; background: #f8d7da; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { background: #5568d3; }
        .manual-input {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin: 10px 0;
        }
        .scan-count {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #27ae60;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 QR Scanner</h1>

        <div id="status" class="status">
            <strong>Durum:</strong> Yükleniyor...
        </div>

        <div class="scan-count">
            Okunan: <span id="scanCount">0</span>
        </div>

        <div id="reader"></div>

        <div id="result"></div>

        <div class="manual-input">
            <h3>📝 Manuel Giriş (Kamera Çalışmazsa)</h3>
            <input type="text" id="manualInput" placeholder="QR kod UUID'sini buraya yapıştır">
            <button onclick="manualScan()">Manuel Gönder</button>
        </div>

        <button onclick="location.reload()">🔄 Sayfayı Yenile</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let scanCount = 0;
        let lastScan = '';
        let lastScanTime = 0;

        // Status update function
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.innerHTML = '<strong>Durum:</strong> ' + message;
            status.className = 'status ' + type;
        }

        // Initialize Socket.IO
        try {
            socket = io();
            socket.on('connect', () => {
                console.log('Socket.IO connected');
                updateStatus('✅ Sunucuya bağlandı', 'success');
                socket.emit('identify', { type: 'scanner', name: 'Telefon Scanner' });
            });
            socket.on('connect_error', (err) => {
                console.error('Socket error:', err);
                updateStatus('❌ Sunucu bağlantısı hatası: ' + err.message, 'error');
            });
        } catch (e) {
            console.error('Socket init error:', e);
            updateStatus('❌ Socket.IO başlatılamadı', 'error');
        }

        // Function to send scan
        async function sendScan(qrData) {
            const now = Date.now();
            if (qrData === lastScan && now - lastScanTime < 3000) {
                return; // Prevent duplicates within 3 seconds
            }

            lastScan = qrData;
            lastScanTime = now;

            updateStatus('⏳ Kontrol ediliyor...', 'warning');

            try {
                const response = await fetch('/api/attendance/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        qr_code: qrData,
                        device_id: 'mobile-scanner'
                    })
                });

                const data = await response.json();

                const resultDiv = document.getElementById('result');

                if (data.success) {
                    scanCount++;
                    document.getElementById('scanCount').textContent = scanCount;

                    resultDiv.innerHTML = `
                        <div class="result-box success">
                            <h2>✅ Başarılı!</h2>
                            <p><strong>${data.participant.name}</strong></p>
                            <p>${data.message}</p>
                        </div>
                    `;
                    updateStatus('✅ Tarama başarılı!', 'success');

                    // Auto-clear after 3 seconds
                    setTimeout(() => {
                        resultDiv.innerHTML = '';
                        updateStatus('📷 Yeni QR kod bekleniyor...', 'success');
                    }, 3000);

                } else if (data.warning) {
                    resultDiv.innerHTML = `
                        <div class="result-box warning">
                            <h2>⚠️ Uyarı</h2>
                            <p><strong>${data.participant.name}</strong></p>
                            <p>${data.message}</p>
                        </div>
                    `;
                    updateStatus('⚠️ Zaten kayıtlı', 'warning');

                    setTimeout(() => {
                        resultDiv.innerHTML = '';
                        updateStatus('📷 Yeni QR kod bekleniyor...', 'success');
                    }, 3000);

                } else {
                    resultDiv.innerHTML = `
                        <div class="result-box error">
                            <h2>❌ Hata</h2>
                            <p>${data.error || 'Geçersiz QR kod'}</p>
                        </div>
                    `;
                    updateStatus('❌ QR kod geçersiz', 'error');

                    setTimeout(() => {
                        resultDiv.innerHTML = '';
                        updateStatus('📷 Yeni QR kod bekleniyor...', 'success');
                    }, 3000);
                }

            } catch (error) {
                console.error('Scan error:', error);
                updateStatus('❌ Bağlantı hatası: ' + error.message, 'error');

                document.getElementById('result').innerHTML = `
                    <div class="result-box error">
                        <h2>❌ Bağlantı Hatası</h2>
                        <p>${error.message}</p>
                        <p>Sunucu çalışıyor mu kontrol edin.</p>
                    </div>
                `;
            }
        }

        // Manual scan function
        async function manualScan() {
            const input = document.getElementById('manualInput');
            const qrData = input.value.trim();

            if (!qrData) {
                alert('Lütfen QR kod verisini girin!');
                return;
            }

            await sendScan(qrData);
            input.value = '';
        }

        // Try to initialize camera
        updateStatus('📷 Kamera açılıyor...', 'warning');

        // Try loading Html5Qrcode library
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.onload = () => {
            console.log('Html5Qrcode loaded');
            initCamera();
        };
        script.onerror = () => {
            console.error('Failed to load Html5Qrcode');
            updateStatus('❌ QR kütüphanesi yüklenemedi. Manuel giriş kullanın.', 'error');
            document.getElementById('reader').innerHTML = '<p style="padding: 20px; text-align: center; color: #666;">Kamera başlatılamadı. Aşağıdaki manuel giriş kutusunu kullanın.</p>';
        };
        document.head.appendChild(script);

        function initCamera() {
            if (typeof Html5Qrcode === 'undefined') {
                updateStatus('❌ QR kütüphanesi yüklenemedi', 'error');
                return;
            }

            const scanner = new Html5Qrcode("reader");

            scanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    console.log('QR scanned:', decodedText);
                    sendScan(decodedText);
                },
                (errorMessage) => {
                    // Ignore scan errors (no QR in view)
                }
            ).then(() => {
                console.log('Camera started successfully');
                updateStatus('📷 Kamera hazır! QR kod taratın.', 'success');
            }).catch(err => {
                console.error('Camera error:', err);
                updateStatus('❌ Kamera açılamadı: ' + err, 'error');
                document.getElementById('reader').innerHTML = `
                    <div style="padding: 20px; text-align: center;">
                        <p style="color: #e74c3c; font-weight: bold;">❌ Kamera Açılamadı</p>
                        <p style="color: #666; margin-top: 10px;">Sebep: ${err}</p>
                        <p style="color: #666; margin-top: 10px;">Lütfen:</p>
                        <ul style="text-align: left; color: #666; margin: 10px auto; max-width: 300px;">
                            <li>Kamera iznini verin</li>
                            <li>Sayfayı yenileyin</li>
                            <li>Farklı tarayıcı deneyin</li>
                            <li>Manuel giriş kullanın (aşağıda)</li>
                        </ul>
                    </div>
                `;
            });
        }

        // Allow Enter key for manual input
        document.getElementById('manualInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                manualScan();
            }
        });
    </script>
</body>
</html>
